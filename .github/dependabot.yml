version: 2
updates:
  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Next.js, React og Prisma opgraderes bevidst og manuelt i major-spring (se docs/ops/CI.md).
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
